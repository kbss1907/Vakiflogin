<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-xl w-full space-y-8 glass-panel p-10 rounded-3xl">
    <div>
      <h2 class="mt-2 text-center text-4xl font-extrabold text-white tracking-tight">Hesap Oluştur</h2>
      <p class="mt-3 text-center text-sm text-gray-300">
        Yeni bir hesap oluşturarak aramıza katılın
      </p>
    </div>

    <form class="mt-8 space-y-6" [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Ad -->
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-1">Ad</label>
          <input formControlName="firstName" type="text" required
            class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
            placeholder="Ahmet">
        </div>
        <!-- Soyad -->
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-1">Soyad</label>
          <input formControlName="lastName" type="text" required
            class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
            placeholder="Yılmaz">
        </div>
      </div>

      <!-- Telefon -->
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-1">Telefon</label>
        <input formControlName="phone" type="tel"
          class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
          placeholder="05XX XXX XX XX">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Departman -->
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-1">Departman</label>
          <select formControlName="departmentId" class="hidden">
            <option [value]="1" selected>1</option>
          </select>
          <input formControlName="departmentId" type="number" 
            class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
            placeholder="Departman ID (Örn: 1)">
        </div>
        <!-- Pozisyon -->
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-1">Pozisyon</label>
          <select formControlName="positionId" class="hidden">
            <option [value]="1" selected>1</option>
          </select>
          <input formControlName="positionId" type="number" 
            class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
            placeholder="Pozisyon ID (Örn: 1)">
        </div>
      </div>

      <!-- E-posta -->
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-1">E-posta Adresi</label>
        <input formControlName="email" type="email" required
          class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
          placeholder="ornek@vakif.com">
      </div>

      <!-- Şifre -->
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-1">Şifre</label>
        <input formControlName="password" type="password" required
          class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
          placeholder="••••••••">
      </div>

      <div class="pt-2">
        <button type="submit" [disabled]="registerForm.invalid"
          class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/50 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
          Hesabımı Oluştur
        </button>
      </div>
    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-400 font-medium">
        Zaten hesabınız var mı?
        <a routerLink="/login" class="font-bold text-blue-400 hover:text-blue-300 transition-colors duration-200">
          Giriş Yap
        </a>
      </p>
    </div>
  </div>
</div>
