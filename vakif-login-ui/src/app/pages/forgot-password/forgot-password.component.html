<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-panel p-10 rounded-3xl">
        <div>
            <h2 class="mt-2 text-center text-4xl font-extrabold text-white tracking-tight">Şifremi Unuttum</h2>
            <p class="mt-3 text-center text-sm text-gray-300">
                Sisteme kayıtlı E-posta adresinizi girin. Size bir şifre sıfırlama kodu göndereceğiz.
            </p>
        </div>

        <form class="mt-8 space-y-6" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-300 mb-1">E-posta Adresi</label>
                    <input id="email" formControlName="email" type="email" autocomplete="email" required
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
                        placeholder="ornek@vakif.com">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" [disabled]="forgotForm.invalid || isSubmitting"
                    class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/50 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-blue-300 group-hover:text-blue-200 transition ease-in-out duration-150"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </span>
                    <span *ngIf="!isSubmitting">Sıfırlama Kodu Gönder</span>
                    <span *ngIf="isSubmitting">Gönderiliyor...</span>
                </button>
            </div>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-gray-400 font-medium">
                Şifrenizi hatırladınız mı?
                <a routerLink="/login"
                    class="font-bold text-blue-400 hover:text-blue-300 transition-colors duration-200">
                    Giriş Ekranına Dön
                </a>
            </p>
        </div>
    </div>
</div>
