<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-panel p-10 rounded-3xl">
        <div>
            <h2 class="mt-2 text-center text-4xl font-extrabold text-white tracking-tight">Yeni Şifre Belirle</h2>
            <p class="mt-3 text-center text-sm text-gray-300">
                E-postanıza (veya konsola) gelen 8 haneli sıfırlama kodunu ve yeni şifrenizi girin.
            </p>
        </div>

        <form class="mt-8 space-y-6" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <div class="space-y-4">

                <div>
                    <label for="token" class="block text-sm font-semibold text-gray-300 mb-1">Şifre Sıfırlama Kodu (8
                        Hane)</label>
                    <input id="token" formControlName="token" type="text" required
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm uppercase font-mono"
                        placeholder="A1B2C3D4">
                    <div *ngIf="resetForm.get('token')?.touched && resetForm.get('token')?.invalid"
                        class="text-xs text-red-400 mt-1">
                        Sıfırlama kodu en az 8 karakter olmalıdır.
                    </div>
                </div>

                <div>
                    <label for="newPassword" class="block text-sm font-semibold text-gray-300 mb-1">Yeni Şifre</label>
                    <input id="newPassword" formControlName="newPassword" type="password" required
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
                        placeholder="••••••••">
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-semibold text-gray-300 mb-1">Şifre
                        (Tekrar)</label>
                    <input id="confirmPassword" formControlName="confirmPassword" type="password" required
                        class="appearance-none rounded-xl relative block w-full px-4 py-3 glass-input sm:text-sm"
                        placeholder="••••••••">
                    <div *ngIf="resetForm.errors?.['mismatch'] && (resetForm.get('confirmPassword')?.touched || resetForm.get('newPassword')?.touched)"
                        class="text-xs text-red-400 mt-1">
                        Şifreler birbiriyle eşleşmiyor.
                    </div>
                </div>

            </div>

            <div class="pt-2">
                <button type="submit" [disabled]="resetForm.invalid || isSubmitting"
                    class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-4 focus:ring-green-500/50 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-green-300 group-hover:text-green-200 transition ease-in-out duration-150"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </span>
                    <span *ngIf="!isSubmitting">Şifreyi Güncelle</span>
                    <span *ngIf="isSubmitting">Güncelleniyor...</span>
                </button>
            </div>
        </form>

        <div class="text-center mt-6">
            <p class="text-sm text-gray-400 font-medium">
                İşlemden vazgeç.
                <a routerLink="/login" class="font-bold text-gray-300 hover:text-white transition-colors duration-200">
                    İptal Et
                </a>
            </p>
        </div>
    </div>
</div>
